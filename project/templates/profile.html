<!DOCTYPE html>
<html>
    <head>
        <title>Peeps Finder</title>
        <!-- Links to the CSS file -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <div id="profile_ui">
            <p id="userID" hidden>{{user_id}}</p>
            <p id="currentUserID" hidden>{{current_user_id}}</p>
            <p id="attachment1Filename" hidden>{{attach_1_name}}</p>
            <p id="attachment2Filename" hidden>{{attach_2_name}}</p>
            <p id="attachment3Filename" hidden>{{attach_3_name}}</p>
            <p id="username" hidden>{{username}}</p>
            <p id="fname" hidden>{{fname}}</p>
            <p id="lname" hidden>{{lname}}</p>
            <p id="bio" hidden>{{bio}}</p>
            <p id="delete_acc_link" hidden>{{url_for('onDeleteAccount', user_id=user_id)}}</p>
        </div>
        
        <!-- Back button that goes to the homepage -->
        <form action="/home" method="GET">
            <input type="submit" id="back_button" value="Back">
        </form>

        <!-- Link to JS file -->
        <script type="module" src="{{ url_for('static', filename='js/profile.js') }}"></script>
    </body>
</html>
